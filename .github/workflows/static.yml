          grep -q 'function filterInvestmentOpportunities' index.html
          grep -q 'id="brief-province"' index.html
          grep -q 'id="export-province-brief"' index.html
          grep -q 'function exportProvinceBrief' index.html
          grep -q 'href="./nodos-estrategicos/"' index.html
          grep -q 'href="./radar-ia/"' index.html
