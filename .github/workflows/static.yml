# Validate data and deploy the static site to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate investment sector map filters
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          sectors = ["Forestoindustria", "Turismo", "Infraestructura", "Minería", "Tecnología", "Siderurgia", "Energía", "Petróleo y gas"]
          for sector in sectors:
              assert f'data-sector="{sector}"' in html, f"Falta el filtro sectorial: {sector}"
          assert "function matchesSector" in html, "Falta el criterio de asociación sectorial"
          assert "matchesSector(p,activeSector)" in html, "El filtro sectorial no se aplica al catálogo"
          assert "no acredita un proyecto ni una oportunidad de inversión" in html, "Falta la advertencia de alcance"
          print("Mapa sectorial: ocho sectores, filtrado y advertencia de alcance comprobados.")
          PY
      - name: Validate bilingual interface
        run: |
          node --check assets/i18n.js
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          script = Path("assets/i18n.js").read_text(encoding="utf-8")
          assert 'id="language-select"' in html, "Falta el selector de idioma"
          assert './assets/i18n.js' in html, "Falta cargar el módulo de traducciones"
          assert 'document.documentElement.lang=language' in script, "El idioma del documento no se actualiza"
          assert 'localStorage.setItem(storageKey,language)' in script, "No se conserva la preferencia de idioma"
          assert 'setLanguage:apply' in script, "No se expone la API reutilizable"
          assert "originalText=new WeakMap()" in script, "El cambio de idioma debe preservar los textos originales"
          print("Interfaz bilingüe: sintaxis, selector, persistencia, API y reversibilidad comprobados.")
          PY
      - name: Test Federal Reports provincial comparison
        run: |
          node --check assets/profile-comparison.js
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const { compareProfiles } = require("./assets/profile-comparison.js");
          const metadata = {
            period: "2025",
            unit: "millones de USD FOB",
            publisher: "INDEC",
            published: "2026-03-10",
            sourceUrl: "https://www.indec.gob.ar/uploads/informesdeprensa/opex_03_26929F77A2CA.pdf",
            verification: {
              status: "verified",
              checkedAt: "2026-11-21",
              scope: "Fixture de prueba; los tres indicadores pertenecen al mismo conjunto OPEX."
            }
          };
          const buenosAires = { province: "Buenos Aires", exportsUsdMillions: 31684, yearOnYearPct: 7.3, nationalSharePct: 36.4 };
          const cordoba = { province: "Córdoba", exportsUsdMillions: 10913, yearOnYearPct: 6.7, nationalSharePct: 12.5 };
          const result = compareProfiles(buenosAires, cordoba, metadata);
          assert.equal(result.period, "2025");
          assert.equal(result.publisher, "INDEC");
          assert.equal(result.differences.exportsUsdMillions, 20771);
          assert.ok(Math.abs(result.differences.yearOnYearPct - 0.6) < 1e-9);
          assert.ok(Math.abs(result.differences.nationalSharePct - 23.9) < 1e-9);
          assert.throws(() => compareProfiles(buenosAires, buenosAires, metadata), /diferentes/);
          assert.throws(() => compareProfiles(buenosAires, cordoba, { ...metadata, verification: { ...metadata.verification, status: "outdated" } }), /verificada/);
          assert.throws(() => compareProfiles(buenosAires, cordoba, { ...metadata, verification: { ...metadata.verification, checkedAt: "2026-03-09" } }), /preceder/);
          const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
          assert.throws(() => compareProfiles(buenosAires, cordoba, { ...metadata, verification: { ...metadata.verification, checkedAt: tomorrow } }), /futura/);
          assert.throws(() => compareProfiles({ ...buenosAires, exportsUsdMillions: NaN }, cordoba, metadata), /no finito/);
          assert.throws(() => compareProfiles(buenosAires, cordoba, { ...metadata, sourceUrl: "http://example.org/data" }), /HTTPS/);
          const exportTable = require("./assets/profile-comparison.js").toExportTable(result);
          assert.equal(exportTable.rows.length, 3);
          assert.ok(exportTable.headers.includes("Período"));
          assert.ok(exportTable.headers.includes("URL de fuente"));
          assert.ok(exportTable.headers.includes("Fecha de verificación"));
          assert.deepEqual(exportTable.rows[0].slice(1, 6), ["Buenos Aires", 31684, "Córdoba", 10913, 20771]);
          assert.equal(exportTable.rows[0][8], "2025");
          assert.equal(exportTable.rows[0][9], "INDEC");
          assert.equal(exportTable.rows[0][12], "verified");
          assert.equal(exportTable.rows[0][13], "2026-11-21");
          assert.equal(exportTable.rows[1][7], "puntos porcentuales");
          assert.equal(exportTable.rows[2][7], "puntos porcentuales");
          assert.throws(() => require("./assets/profile-comparison.js").toExportTable({ ...result, verification: { ...result.verification, status: "outdated" } }), /verificación/);
          assert.throws(() => require("./assets/profile-comparison.js").toExportTable({ ...result, sourceUrl: "http://example.org/data" }), /HTTPS/);
          console.log("Federal Reports: comparación homogénea, diferencias, exportación trazable y rechazos de seguridad aprobados.");
          NODE
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess
          html = Path("index.html").read_text(encoding="utf-8")
          helper = Path("assets/profile-comparison.js").read_text(encoding="utf-8")
          translations = Path("assets/i18n.js").read_text(encoding="utf-8")
          modules = json.loads(Path("data/ai-modules.json").read_text(encoding="utf-8"))
          assert 'id="comparison-province-a"' in html and 'id="comparison-province-b"' in html
          assert './assets/profile-comparison.js' in html
          assert 'MapaFederalProfileComparison.compareProfiles' in html
          assert 'MapaFederalProfileComparison.toExportTable(lastProfileComparison)' in html
          assert 'id="export-profile-comparison"' in html
          assert 'id="profile-comparison-export-status"' in html
          assert '"Exportar comparación CSV":"Export comparison CSV"' in translations
          assert '"Compará dos jurisdicciones":"Compare two jurisdictions"' in translations
          assert '"millones de USD FOB":"millions of FOB USD"' in translations
          assert 'were checked against table 1' in translations
          assert '<span>Verificado</span>' in html
          federal = next(item for item in modules["modules"] if item["id"] == "federal-reports")
          assert federal["status"] == "pilot"
          assert "comparar dos jurisdicciones" in federal["currentCapability"]
          inline_scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          assert inline_scripts, "No se encontró el JavaScript de la interfaz"
          subprocess.run(["node", "--check", "-"], input=inline_scripts[-1], text=True, check=True)
          print("Interfaz, traducción, estado honesto y sintaxis del JavaScript inline: OK.")
          PY
      - name: Test Federal Reports CSV export safety and provenance
        run: |
          node - <<'JS'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const vm = require("node:vm");
          const html = fs.readFileSync("index.html", "utf8");
          const start = html.indexOf("function csvCell(value){");
          const end = html.indexOf("\nfunction downloadCsv", start);
          assert.ok(start >= 0 && end > start, "No se encontró el serializador CSV.");
          const csvCell = vm.runInNewContext("(" + html.slice(start, end) + ")");
          assert.equal(csvCell("a;b"), '"a;b"');
          assert.equal(csvCell('a"b'), '"a""b"');
          assert.equal(csvCell("línea 1\nlínea 2"), '"línea 1\nlínea 2"');
          assert.equal(csvCell("=1+1"), "\"'=1+1\"");
          assert.equal(csvCell(" +SUM(A1:A2)"), "\"' +SUM(A1:A2)\"");
          assert.equal(csvCell("-2"), "\"'-2\"");
          assert.equal(csvCell("@SUM(1)"), "\"'@SUM(1)\"");
          assert.equal(csvCell(42), '"42"');
          assert.equal(csvCell(null), '""');
          const exportStart = html.indexOf("function exportVisibleProfiles(){");
          const exportEnd = html.indexOf("\nfunction exportProvinceBrief", exportStart);
          assert.ok(exportStart >= 0 && exportEnd > exportStart, "No se encontró la exportación de perfiles.");
          const profileExport = html.slice(exportStart, exportEnd);
          for (const field of [
            "Período OPEX",
            "Publicación de la fuente estadística",
            "Organismo publicador estadístico",
            "Estado de verificación estadística",
            "Fecha de verificación estadística",
            "Alcance de verificación estadística",
            "Fuente estadística"
          ]) {
            assert.ok(profileExport.includes(field), "La exportación perdió trazabilidad: " + field);
          }
          assert.ok(profileExport.includes('mapa-federal-perfiles-provinciales.csv'), "Falta el archivo de exportación de perfiles.");
          console.log("Federal Reports: CSV escapado, neutralización de fórmulas y metadatos de procedencia comprobados.");
          JS

      - name: Test Investment Finder filtered CSV export and provenance
        run: |
          node --check assets/investment-export.js
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const catalog = require("./data/investment-opportunities.json");
          const { toExportTable } = require("./assets/investment-export.js");
          const table = toExportTable(catalog.opportunities, catalog);
          assert.equal(table.rows.length, catalog.opportunities.length);
          const column = name => table.headers.indexOf(name);
          assert.ok(column("URL de la fuente") >= 0);
          assert.ok(column("Período") >= 0);
          assert.ok(column("Fecha de publicación de la fuente") >= 0);
          assert.ok(column("Estado de verificación") >= 0);
          assert.ok(column("Fecha de verificación") >= 0);
          assert.ok(column("Alcance de verificación") >= 0);
          const rimi = catalog.opportunities.find(item => item.id === "rimi-eficiencia-energetica-2026");
          const rimiRow = toExportTable([rimi], catalog).rows[0];
          assert.equal(rimiRow[column("Estado de oportunidad (código)")], "unknown");
          assert.equal(rimiRow[column("Estado de oportunidad")], "Disponibilidad no confirmada");
          assert.equal(rimiRow[column("Fecha de publicación de la fuente")], "2026-11-04");
          assert.equal(rimiRow[column("Estado de verificación (código)")], "verified");
          assert.equal(rimiRow[column("Período")], rimi.period);
          assert.equal(rimiRow[column("URL de la fuente")], rimi.sourceUrl);
          assert.throws(() => toExportTable([{ ...rimi, sourceUrl: "http://example.org/source" }], catalog), /HTTPS/);
          assert.throws(() => toExportTable([{ ...rimi, period: " " }], catalog), /period/);
          assert.throws(() => toExportTable([{ ...rimi, verification: { ...rimi.verification, checkedAt: "2026-11-03" } }], catalog), /incoherente/);
          assert.throws(() => toExportTable([{ ...rimi, amount: { value: Infinity, currency: "ARS", basis: "Monto de prueba" } }], catalog), /Monto publicado inválido/);
          const page = fs.readFileSync("investment-finder/index.html", "utf8");
          const translations = fs.readFileSync("assets/i18n.js", "utf8");
          assert.ok(page.includes('../assets/investment-export.js'));
          assert.ok(page.includes('id="export-investment-results"'));
          assert.ok(page.includes('id="investment-export-status"'));
          assert.ok(page.includes('MapaFederalInvestmentExport.toExportTable(filtered,investmentMetadata)'));
          assert.ok(page.includes('downloadCsv("mapa-federal-oportunidades-filtradas.csv"'));
          assert.ok(translations.includes('"Exportar resultados CSV":"Export filtered results CSV"'));
          console.log("Investment Finder: exportación del conjunto filtrado, estados unknown, fuentes, fechas, períodos y rechazos de datos inválidos comprobados.");
          NODE
      - name: Test scalable strategic node directory
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          assert 'id="poi-prev"' in html and 'id="poi-next"' in html, "Faltan controles de paginación del directorio"
