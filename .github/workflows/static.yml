# Validate data and deploy the static site to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate geographic and editorial JSON
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from urllib.parse import urlparse

          with open("data/strategic-nodes.json", encoding="utf-8") as f:
              nodes = json.load(f)
          with open("data/news.json", encoding="utf-8") as f:
              news = json.load(f)
          with open("data/provincial-profiles.json", encoding="utf-8") as f:
              provincial_data = json.load(f)
          with open("data/ai-modules.json", encoding="utf-8") as f:
              module_data = json.load(f)
          modules = module_data.get("modules")
          assert isinstance(modules, list) and len(modules) == 6, "Deben existir seis módulos documentados"
          module_ids = [module.get("id") for module in modules]
          assert len(set(module_ids)) == 6, "IDs de módulos duplicados"
          assert set(module_ids) == {"federal-ai-assistant", "investment-finder", "territorial-monitor", "event-intelligence", "federal-reports", "executive-travel-ai"}, "Falta o sobra un módulo"
          statuses = {module.get("id"): module.get("status") for module in modules}
          assert statuses["federal-reports"] == "pilot", "Federal Reports debe reflejar el piloto funcional actual"
          assert all(statuses[module_id] == "planned" for module_id in module_ids if module_id != "federal-reports"), "Un módulo futuro aparece como operativo sin implementación"
          for module in modules:
              for field in ("name", "description", "statusLabel", "currentCapability", "nextStep"):
                  assert isinstance(module.get(field), str) and module[field].strip(), f"Módulo sin {field}: {module.get('id')}"
              assert isinstance(module.get("dependencies"), list) and module["dependencies"], f"Módulo sin dependencias: {module.get('id')}"
          print("Hoja de ruta válida: 6 módulos, 1 piloto funcional y 5 módulos planificados.")

          assert isinstance(nodes, list) and nodes, "El catálogo de nodos está vacío"
          assert isinstance(news, list), "El archivo de noticias debe ser una lista"
          names = set()
          allowed_node_types = {"Ciudad", "Puerto", "Aeropuerto", "Paso fronterizo", "Logística", "Industria", "Turismo"}
          expected_jurisdictions = {
              "CABA", "Buenos Aires", "Catamarca", "Chaco", "Chubut", "Córdoba",
              "Corrientes", "Entre Ríos", "Formosa", "Jujuy", "La Pampa", "La Rioja",
              "Mendoza", "Misiones", "Neuquén", "Río Negro", "Salta", "San Juan",
              "San Luis", "Santa Cruz", "Santa Fe", "Santiago del Estero",
              "Tierra del Fuego", "Tucumán"
          }
          for node in nodes:
              for field in ("name", "province", "type", "note", "source"):
                  assert isinstance(node.get(field), str) and node[field].strip(), f"Nodo sin {field}"
              assert node["province"] in expected_jurisdictions, f"Jurisdicción no admitida: {node['province']}"
              assert node["type"] in allowed_node_types, f"Tipo de nodo no admitido: {node['type']}"
              coords = node.get("coords")
              assert isinstance(coords, list) and len(coords) == 2, f"Coordenadas inválidas: {node.get('name')}"
              lat, lon = coords
              assert isinstance(lat, (int, float)) and not isinstance(lat, bool), f"Latitud no numérica: {node['name']}"
              assert isinstance(lon, (int, float)) and not isinstance(lon, bool), f"Longitud no numérica: {node['name']}"
              assert -55.2 <= lat <= -21.7 and -73.6 <= lon <= -53.5, f"Coordenada fuera del rango argentino: {node['name']}"
              source = urlparse(node["source"])
              assert source.scheme == "https" and source.netloc, f"Fuente no HTTPS: {node['name']}"
              coordinate_source = node.get("coordinateSource")
              if coordinate_source:
                  parsed_coordinate_source = urlparse(coordinate_source)
                  assert parsed_coordinate_source.scheme == "https" and parsed_coordinate_source.netloc, f"Fuente de coordenadas no HTTPS: {node['name']}"
              key = " ".join(node["name"].split()).casefold()
              assert key not in names, f"Nodo duplicado (ignorando mayúsculas y espacios): {node['name']}"
              names.add(key)

          expected_jurisdictions = {
              "CABA", "Buenos Aires", "Catamarca", "Chaco", "Chubut", "Córdoba",
              "Corrientes", "Entre Ríos", "Formosa", "Jujuy", "La Pampa", "La Rioja",
              "Mendoza", "Misiones", "Neuquén", "Río Negro", "Salta", "San Juan",
              "San Luis", "Santa Cruz", "Santa Fe", "Santiago del Estero",
              "Tierra del Fuego", "Tucumán"
          }
          covered_jurisdictions = {node["province"] for node in nodes}
          missing_jurisdictions = expected_jurisdictions - covered_jurisdictions
          assert not missing_jurisdictions, f"Faltan jurisdicciones en el catálogo: {sorted(missing_jurisdictions)}"
          assert provincial_data.get("period") == "2025", "El período del dataset provincial debe ser 2025"
          assert provincial_data.get("publisher") == "INDEC", "La fuente de exportaciones provinciales debe ser INDEC"
          assert isinstance(provincial_data.get("published"), str), "Falta fecha de publicación del dataset provincial"
          verification = provincial_data.get("verification")
          assert isinstance(verification, dict), "Falta el registro de verificación del dataset provincial"
          assert verification.get("status") in {"verified", "not_verified", "outdated"}, "Estado de verificación provincial no admitido"
          assert isinstance(verification.get("checkedAt"), str), "Falta fecha de verificación provincial"
          verification_date = date.fromisoformat(verification["checkedAt"])
          assert verification_date <= date.today(), "La fecha de verificación provincial no puede ser futura"
          assert isinstance(verification.get("scope"), str) and verification["scope"].strip(), "Falta el alcance de verificación provincial"
          source_url = urlparse(provincial_data.get("sourceUrl", ""))
          assert source_url.scheme == "https" and source_url.netloc, "Fuente OPEX no HTTPS"
          province_profiles = provincial_data.get("profiles")
          assert isinstance(province_profiles, list) and len(province_profiles) == 24, "Se requieren 24 perfiles provinciales"
          profile_names = set()
          allowed_regions = {"Pampeana", "Patagonia", "NOA", "Cuyo", "NEA"}
          for profile in province_profiles:
              for field in ("province", "region", "profileUrl"):
                  assert isinstance(profile.get(field), str) and profile[field].strip(), f"Perfil provincial sin {field}"
              assert profile["region"] in allowed_regions, f"Región no admitida: {profile['region']}"
              assert profile["province"] not in profile_names, f"Perfil provincial duplicado: {profile['province']}"
              profile_names.add(profile["province"])
              assert isinstance(profile.get("exportsUsdMillions"), (int, float)) and profile["exportsUsdMillions"] >= 0, f"Exportaciones inválidas: {profile['province']}"
              assert isinstance(profile.get("yearOnYearPct"), (int, float)), f"Variación interanual inválida: {profile['province']}"
              assert isinstance(profile.get("nationalSharePct"), (int, float)) and 0 <= profile["nationalSharePct"] <= 100, f"Participación inválida: {profile['province']}"
              profile_url = urlparse(profile["profileUrl"])
              assert profile_url.scheme == "https" and profile_url.netloc, f"Ficha provincial no HTTPS: {profile['province']}"
          assert profile_names == expected_jurisdictions, f"Los perfiles no cubren exactamente las 24 jurisdicciones: {sorted(expected_jurisdictions - profile_names)}"

          categories = {"Economía", "Empresas", "Comercio", "Infraestructura", "Regulación", "Tecnología"}

          def canonical_news_url(raw_url):
              parsed = urlparse(raw_url)
              scheme = parsed.scheme.lower()
              if parsed.username is not None or parsed.password is not None:
                  raise ValueError("Las URLs editoriales no deben incluir credenciales")
              hostname = parsed.hostname
              if not hostname:
                  raise ValueError("La URL editorial debe incluir un host")
              port = parsed.port
              host = hostname.lower()
              if ":" in host and not host.startswith("["):
                  host = f"[{host}]"
              netloc = host if port in (None, 443) else f"{host}:{port}"
              return parsed._replace(
                  scheme=scheme,
                  netloc=netloc,
                  path=parsed.path or "/",
                  fragment=""
              ).geturl()

          assert canonical_news_url("HTTPS://Example.COM:443#seccion") == "https://example.com/"
          assert canonical_news_url("https://example.com") == canonical_news_url("https://example.com/")
          assert canonical_news_url("https://example.com:8443/noticia") == "https://example.com:8443/noticia"
          assert canonical_news_url("https://example.com/noticia?id=1") != canonical_news_url("https://example.com/noticia?id=2")
          try:
              canonical_news_url("https://usuario:clave@example.com/noticia")
          except ValueError:
              pass
          else:
              raise AssertionError("No se rechazó una URL editorial con credenciales")

          news_urls = set()
          news_titles = set()
          for item in news:
              for field in ("title", "date", "category", "summary", "source", "url"):
                  assert isinstance(item.get(field), str) and item[field].strip(), f"Noticia sin {field}"
              date.fromisoformat(item["date"])
              assert item["date"] <= date.today().isoformat(), f"Noticia con fecha futura: {item['title']}"
              assert item["category"] in categories, f"Categoría no admitida: {item['category']}"
              assert len(item["summary"]) <= 700, f"Síntesis demasiado extensa: {item['title']}"
              url = urlparse(item["url"])
              assert url.scheme == "https" and url.netloc, f"URL de noticia no HTTPS: {item['title']}"
              canonical_url = canonical_news_url(item["url"])
              assert canonical_url not in news_urls, f"Noticia duplicada por URL canónica: {item['url']}"
              news_urls.add(canonical_url)
              title_key = " ".join(item["title"].split()).casefold()
              assert title_key not in news_titles, f"Titular duplicado: {item['title']}"
              news_titles.add(title_key)

          assert [item["date"] for item in news] == sorted((item["date"] for item in news), reverse=True), "Las noticias deben estar ordenadas de más recientes a más antiguas"

          ibicuy = next((node for node in nodes if node["name"] == "Puerto de Ibicuy"), None)
          assert ibicuy and ibicuy["province"] == "Entre Ríos", "Falta el nodo oficial Puerto de Ibicuy"
          assert ibicuy.get("coordinateSource") == ibicuy["source"], "La fuente de coordenadas de Ibicuy debe estar declarada"
          print(f"Validación correcta: {len(nodes)} nodos en {len(covered_jurisdictions)} jurisdicciones y {len(news)} noticias.")
          PY
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I | re.S)
          assert scripts, "No se encontró JavaScript de aplicación"
          Path("/tmp/mapafederal-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/mapafederal-inline.js
      - name: Test CSV formula-injection protection
        run: |
          node - <<'JS'
          const fs = require("fs");
          const vm = require("vm");
          const html = fs.readFileSync("index.html", "utf8");
          const start = html.indexOf("function csvCell(value){");
          const end = html.indexOf("\nfunction downloadCsv", start);
          if (start < 0 || end < 0) throw new Error("No se encontró csvCell para probar.");
          const csvCell = vm.runInNewContext("(" + html.slice(start, end) + ")");
          if (csvCell("=1+1").charAt(1) !== "'") throw new Error("No se neutralizó una fórmula con =.");
          if (csvCell("  +SUM(A1:A2)").charAt(1) !== "'") throw new Error("No se neutralizó una fórmula precedida por espacios.");
          if (csvCell("@SUM(1,2)").charAt(1) !== "'") throw new Error("No se neutralizó una fórmula con @.");
          if (csvCell(-34.6) !== '"' + String(-34.6) + '"') throw new Error("Se alteró un valor numérico negativo.");
          console.log("CSV seguro: fórmulas neutralizadas y valores numéricos preservados.");
          JS

      - name: Check public entry point
        run: |
          grep -q '<html lang="es">' index.html
          grep -q 'property="og:title"' index.html
          grep -q 'map-province-filter' index.html
          grep -q 'poi-type' index.html
          grep -q 'province-card' index.html
          grep -q 'profile-grid' index.html
          grep -q 'profile-insights' index.html
          grep -q 'renderProfileInsights' index.html
          grep -q 'data/provincial-profiles.json' index.html
          grep -q 'map-fallback' index.html
          grep -q 'aria-live="polite"' index.html
          grep -q 'typeof L !== "undefined"' index.html
          grep -q 'data/strategic-nodes.json' index.html
          grep -q 'data/news.json' index.html
          grep -q 'id="export-nodes"' index.html
          grep -q 'id="export-profiles"' index.html
          grep -q 'function downloadCsv' index.html
          grep -q 'id="brief-province"' index.html
          grep -q 'id="export-province-brief"' index.html
          grep -q 'function exportProvinceBrief' index.html
          grep -q 'Seis módulos, estados transparentes.' index.html
          test "$(grep -o 'id="ai-module-grid"' index.html | wc -l)" -eq 1
          ! grep -q 'Cinco módulos proyectados' index.html
          grep -q 'data/ai-modules.json' index.html
          grep -q 'async function loadModules()' index.html
          grep -q 'docs/intelligence-modules-roadmap.md' README.md

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Allow artifact metadata to propagate
        run: sleep 3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
