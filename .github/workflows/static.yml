          assert.ok(html.includes("IA Finder Bs. As."));
          const start = html.indexOf("function filterInvestmentOpportunities(records,filters){");
          const end = html.indexOf("\nfunction investmentStageLabel", start);
          assert.ok(start >= 0 && end > start, "Missing reusable PBA opportunity filter.");
          const normalizeText = value => String(value ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase("es").trim();
          const filter = vm.runInNewContext("(" + html.slice(start, end) + ")", { normalizeText });
          const escobarRecord = catalog.opportunities.find(o => (o.territorialClassification.municipalities || []).includes("Escobar"));
          assert.ok(escobarRecord, "No documented opportunity is classified for Escobar.");
          const base = { query: "", sector: "all", scope: "all", section: "all", municipality: "all", stage: "all", status: "all", verification: "all" };
