      - name: Validate SEO, GEO and brand assets
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          robots = Path("robots.txt").read_text(encoding="utf-8")
          sitemap = ET.parse("sitemap.xml").getroot()
          logo = Path("assets/mapa-federal.svg").read_text(encoding="utf-8")
          assert '<title>Mapa Federal | Inteligencia territorial y económica de Argentina</title>' in html
          assert 'rel="canonical" href="https://leandrocuellarok-netizen.github.io/mapafederal/"' in html
          assert 'application/ld+json' in html
          block = html.split('<script type="application/ld+json">', 1)[1].split('</script>', 1)[0]
          data = json.loads(block)
          assert any(item.get("@type") == "WebSite" for item in data["@graph"])
          assert any(item.get("@type") == "WebApplication" for item in data["@graph"])
          assert 'id="preguntas"' not in html
          assert "Sitemap: https://leandrocuellarok-netizen.github.io/mapafederal/sitemap.xml" in robots
          urls = [node.text for node in sitemap.findall("{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc")]
          expected_urls = [
              "https://leandrocuellarok-netizen.github.io/mapafederal/",
              "https://leandrocuellarok-netizen.github.io/mapafederal/nodos-estrategicos/",
              "https://leandrocuellarok-netizen.github.io/mapafederal/radar-norte/",
              "https://leandrocuellarok-netizen.github.io/mapafederal/investment-finder/",
              "https://leandrocuellarok-netizen.github.io/mapafederal/foco-escobar/",
          ]
          assert urls == expected_urls
          assert '<svg' in logo and 'aria-label="Mapa Federal"' in logo and '#07502B' in logo and '#A65A18' in logo
          radar = Path("radar-norte/index.html").read_text(encoding="utf-8")
          assert '<title>Radar Norte | Mapa Federal</title>' in radar
          assert 'rel="canonical" href="https://leandrocuellarok-netizen.github.io/mapafederal/radar-norte/"' in radar
          assert 'data/radar-norte.json' in radar
          legacy = Path("radar-ia/index.html").read_text(encoding="utf-8")
          assert "../radar-norte/" in legacy
          foco = Path("foco-escobar/index.html").read_text(encoding="utf-8")
          assert '<title>Foco Escobar | Observatorio territorial - Mapa Federal</title>' in foco
          assert 'rel="canonical" href="https://leandrocuellarok-netizen.github.io/mapafederal/foco-escobar/"' in foco
          assert 'property="og:title"' in foco
          print("SEO/GEO: metadatos, Schema.org, robots y sitemap de cinco páginas, incluido Foco Escobar, validados.")
          PY

