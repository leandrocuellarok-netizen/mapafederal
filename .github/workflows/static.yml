          def validate_event(event):
              required = ("id", "name", "startDate", "endDate", "time", "timeZone", "scope", "jurisdiction", "venue", "organizer", "sector", "sourceName", "sourceUrl", "sourcePublishedAt", "period", "status", "verification")
              for field in required:
                  assert field in event, f"Evento sin campo {field}"
              for field in ("id", "name", "startDate", "timeZone", "scope", "venue", "organizer", "sector", "sourceName", "sourceUrl", "sourcePublishedAt", "status"):
                  assert isinstance(event[field], str) and event[field].strip(), f"Evento con {field} vacío"
              start_date = date.fromisoformat(event["startDate"])
              assert start_date.isoformat() == event["startDate"], f"Fecha de inicio no ISO: {event['id']}"
              end_date = event["endDate"]
              if end_date is not None:
                  parsed_end = date.fromisoformat(end_date)
                  assert parsed_end.isoformat() == end_date and parsed_end >= start_date, f"Rango de fechas inválido: {event['id']}"
              if event["time"] is not None:
                  parsed_time = time.fromisoformat(event["time"])
                  assert parsed_time.strftime("%H:%M") == event["time"], f"Hora inválida (usar HH:MM): {event['id']}"
              try:
                  ZoneInfo(event["timeZone"])
              except ZoneInfoNotFoundError:
                  raise AssertionError(f"Zona horaria IANA no reconocida: {event['timeZone']}")
              assert event["scope"] in event_scopes, f"Alcance de evento no admitido: {event['scope']}"
              jurisdiction = event["jurisdiction"]
              assert jurisdiction is None or jurisdiction in expected_jurisdictions, f"Jurisdicción de evento no admitida: {jurisdiction}"
              if event["scope"] in {"local", "regional"}:
                  assert jurisdiction is not None, f"Evento local/regional sin jurisdicción: {event['id']}"
              assert isinstance(event["period"], str) and event["period"].strip(), f"Período de evento no explícito: {event['id']}"
              assert event["status"] in event_statuses, f"Estado de evento no admitido: {event['id']}"
              source_url = urlparse(event["sourceUrl"])
              assert source_url.scheme == "https" and source_url.hostname and source_url.username is None and source_url.password is None, f"Fuente oficial de evento inválida: {event['id']}"
              published = date.fromisoformat(event["sourcePublishedAt"])
              assert published.isoformat() == event["sourcePublishedAt"], f"Fecha de publicación de fuente no ISO: {event['id']}"
              verification = event["verification"]
              assert isinstance(verification, dict), f"Verificación de evento inválida: {event['id']}"
              assert verification.get("status") in event_verification_statuses, f"Estado de verificación de evento no admitido: {event['id']}"
              checked_at = date.fromisoformat(verification.get("checkedAt", ""))
              assert checked_at.isoformat() == verification["checkedAt"], f"Fecha de verificación no ISO: {event['id']}"
              assert published <= checked_at <= date.today(), f"Fechas de fuente/verificación inconsistentes: {event['id']}"
              assert isinstance(verification.get("scope"), str) and verification["scope"].strip(), f"Evento sin alcance de verificación: {event['id']}"
              last_event_day = date.fromisoformat(end_date) if end_date else start_date
              if event["status"] in {"confirmed", "rescheduled"}:
                  assert verification["status"] == "verified", f"Evento futuro no confirmado por fuente oficial: {event['id']}"
                  assert last_event_day >= date.today(), f"Evento vencido todavía marcado como próximo: {event['id']}"
              if event["status"] == "completed":
                  assert last_event_day <= date.today(), f"Evento marcado como completado tiene fecha futura: {event['id']}"
              return event["id"].strip().casefold()

