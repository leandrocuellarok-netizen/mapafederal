      - name: Test Territorial Monitor jurisdiction filtering
        run: |
          node - <<'JS'
          const fs = require("fs");
          const vm = require("vm");
          const html = fs.readFileSync("index.html", "utf8");
          const i18n = fs.readFileSync("assets/i18n.js", "utf8");
          const news = JSON.parse(fs.readFileSync("data/news.json", "utf8"));
          for (const id of ["news-search", "news-category", "news-jurisdiction", "news-grid"]) {
            if (!html.includes('id="' + id + '"')) throw new Error("Falta el control editorial: " + id);
          }
          if (!html.includes("populateNewsJurisdictionFilter")) throw new Error("No se genera el filtro desde el catálogo.");
          if (!i18n.includes('"Jurisdicciones mencionadas:"') || !i18n.includes('"Jurisdicción provincial no especificada"')) throw new Error("Faltan traducciones territoriales.");
          for (const item of news) {
            if (!Array.isArray(item.jurisdictions) || !Array.isArray(item.geographyEvidence)) throw new Error("Noticia sin metadatos geográficos: " + item.title);
            if (item.geographyStatus === "explicit" && (!item.jurisdictions.length || !item.geographyEvidence.length)) throw new Error("Clasificación explícita incompleta: " + item.title);
            if (item.geographyStatus === "not_specified" && (item.jurisdictions.length || item.geographyEvidence.length)) throw new Error("Se asignó ubicación a un registro ambiguo: " + item.title);
          }
          const start = html.indexOf("function filterNewsItems(items,filters){");
          const end = html.indexOf("\nfunction populateNewsJurisdictionFilter", start);
          if (start < 0 || end < 0) throw new Error("No se encontró el filtro territorial reutilizable.");
          const normalizeText = value => String(value ?? "").toLowerCase().trim();
          const filter = vm.runInNewContext("(" + html.slice(start, end) + ")", { normalizeText });
          const base = { query: "", category: "Todas", jurisdiction: "all" };
          const ush = filter(news, { ...base, jurisdiction: "Tierra del Fuego" });
          if (ush.length !== 1 || !ush[0].title.startsWith("Ushuaia:")) throw new Error("No se localizó Ushuaia en Tierra del Fuego.");
          const chubut = filter(news, { ...base, jurisdiction: "Chubut" });
          if (chubut.length !== 2 || !chubut.some(item => item.title.startsWith("Proyecto Navidad:")) || !chubut.some(item => item.title.startsWith("Chubut:"))) throw new Error("No se localizaron las noticias verificadas de Chubut.");
          const buenosAires = filter(news, { ...base, jurisdiction: "Buenos Aires" });
          if (!buenosAires.some(item => item.title.startsWith("Toyota anunció"))) throw new Error("No se localizó Zárate en Buenos Aires.");
          const caba = filter(news, { ...base, jurisdiction: "CABA" });
          if (caba.length !== 3 || !caba.some(item => item.title.startsWith("Pampa Energía constituyó Pampa AI")) || !caba.some(item => item.title.startsWith("Cuatro emprendimientos fueron distinguidos")) || !caba.some(item => item.title.startsWith("Comenzó la 2.ª Semana de la Inteligencia Artificial"))) throw new Error("CABA y provincia de Buenos Aires no se distinguen o faltan los tres registros CABA esperados.");
          if (filter(news, { ...base, jurisdiction: "Entre Ríos" }).length !== 1) throw new Error("No se localizó Concepción del Uruguay.");
          if (filter(news, { ...base, category: "Empresas", jurisdiction: "Tierra del Fuego" }).length !== 0) throw new Error("Los filtros combinados no son restrictivos.");
          console.log("Territorial Monitor: filtro territorial, filtros combinados, registros ambiguos y traducciones comprobados.");
          JS

