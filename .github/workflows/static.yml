          assert economy["previousPageSnapshot"]["commercialEstablishments2024"] == 7356
          assert economy["infrastructureProjects"][0]["status"] == "anunciado"
          assert economy["companyDirectory"]["status"] == "pendiente"
          for item in economy["industrialAreas"] + economy["companyCases"] + economy["infrastructureProjects"]:
              assert item["status"] in allowed
              parsed = urlparse(item["sourceUrl"])
              assert parsed.scheme == "https" and parsed.netloc
          local_nodes = [item for item in nodes if item.get("district") == "Partido de Escobar"]
