          assert "territory.healthFacilitiesDirectory" in profile_js
          assert "escobar-health-facility" in profile_js
          assert "health.localityCoverageNote" in profile_js
          indicators = economy["indicators"]
          assert indicators["referenceYear"] == 2026
          assert indicators["industrialEstablishments"]["value"] == 382
          assert indicators["commercialEstablishments"]["value"] == 6438
          assert indicators["industrialEstablishments"]["previousYearComparison"] == {"year": 2024, "value": 314}
          assert indicators["commercialEstablishments"]["previousYearComparison"] == {"year": 2024, "value": 5284}
          assert economy["previousPageSnapshot"]["status"] == "histórico"
