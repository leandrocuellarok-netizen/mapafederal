# Validate data and deploy the static site to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate bilingual interface
        run: |
          node --check assets/i18n.js
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          script = Path("assets/i18n.js").read_text(encoding="utf-8")
          assert 'id="language-select"' in html, "Falta el selector de idioma"
          assert './assets/i18n.js' in html, "Falta cargar el módulo de traducciones"
          assert 'document.documentElement.lang=language' in script, "El idioma del documento no se actualiza"
          assert 'localStorage.setItem(storageKey,language)' in script, "No se conserva la preferencia de idioma"
          assert 'setLanguage:apply' in script, "No se expone la API reutilizable"
          assert "originalText=new WeakMap()" in script, "El cambio de idioma debe preservar los textos originales"
          print("Interfaz bilingüe: sintaxis, selector, persistencia, API y reversibilidad comprobados.")
          PY
      - name: Validate geographic and editorial JSON
        run: |
          python - <<'PY'
          import json
          import math
          from datetime import date, time
          from urllib.parse import urlparse
          from zoneinfo import ZoneInfo, ZoneInfoNotFoundError

          with open("data/strategic-nodes.json", encoding="utf-8") as f:
              nodes = json.load(f)
          with open("data/news.json", encoding="utf-8") as f:
              news = json.load(f)
          with open("data/events.json", encoding="utf-8") as f:
              event_catalog = json.load(f)
          with open("data/investment-opportunities.json", encoding="utf-8") as f:
              investment_catalog = json.load(f)
          with open("data/provincial-profiles.json", encoding="utf-8") as f:
              provincial_data = json.load(f)
          with open("data/ai-modules.json", encoding="utf-8") as f:
              module_data = json.load(f)
          modules = module_data.get("modules")
          assert isinstance(modules, list) and len(modules) == 6, "Deben existir seis módulos documentados"
          module_ids = [module.get("id") for module in modules]
          assert len(set(module_ids)) == 6, "IDs de módulos duplicados"
          assert set(module_ids) == {"federal-ai-assistant", "investment-finder", "territorial-monitor", "event-intelligence", "federal-reports", "executive-travel-ai"}, "Falta o sobra un módulo"
          statuses = {module.get("id"): module.get("status") for module in modules}
          assert statuses["federal-reports"] == "pilot", "Federal Reports debe reflejar el piloto funcional actual"
          assert all(statuses[module_id] == "planned" for module_id in module_ids if module_id != "federal-reports"), "Un módulo futuro aparece como operativo sin implementación"
          for module in modules:
              for field in ("name", "description", "statusLabel", "currentCapability", "nextStep"):
                  assert isinstance(module.get(field), str) and module[field].strip(), f"Módulo sin {field}: {module.get('id')}"
              assert isinstance(module.get("dependencies"), list) and module["dependencies"], f"Módulo sin dependencias: {module.get('id')}"
          print("Hoja de ruta válida: 6 módulos, 1 piloto funcional y 5 módulos planificados.")

          assert isinstance(nodes, list) and nodes, "El catálogo de nodos está vacío"
          assert isinstance(news, list), "El archivo de noticias debe ser una lista"
          names = set()
          allowed_node_types = {"Ciudad", "Puerto", "Aeropuerto", "Paso fronterizo", "Logística", "Industria", "Turismo"}
          expected_jurisdictions = {
              "CABA", "Buenos Aires", "Catamarca", "Chaco", "Chubut", "Córdoba",
              "Corrientes", "Entre Ríos", "Formosa", "Jujuy", "La Pampa", "La Rioja",
              "Mendoza", "Misiones", "Neuquén", "Río Negro", "Salta", "San Juan",
              "San Luis", "Santa Cruz", "Santa Fe", "Santiago del Estero",
              "Tierra del Fuego", "Tucumán"
          }
          for node in nodes:
              for field in ("name", "province", "type", "note", "source"):
                  assert isinstance(node.get(field), str) and node[field].strip(), f"Nodo sin {field}"
              assert node["province"] in expected_jurisdictions, f"Jurisdicción no admitida: {node['province']}"
              assert node["type"] in allowed_node_types, f"Tipo de nodo no admitido: {node['type']}"
              coords = node.get("coords")
              assert isinstance(coords, list) and len(coords) == 2, f"Coordenadas inválidas: {node.get('name')}"
              lat, lon = coords
              assert isinstance(lat, (int, float)) and not isinstance(lat, bool), f"Latitud no numérica: {node['name']}"
              assert isinstance(lon, (int, float)) and not isinstance(lon, bool), f"Longitud no numérica: {node['name']}"
              assert -55.2 <= lat <= -21.7 and -73.6 <= lon <= -53.5, f"Coordenada fuera del rango argentino: {node['name']}"
              source = urlparse(node["source"])
              assert source.scheme == "https" and source.netloc, f"Fuente no HTTPS: {node['name']}"
              coordinate_source = node.get("coordinateSource")
              if coordinate_source:
                  parsed_coordinate_source = urlparse(coordinate_source)
                  assert parsed_coordinate_source.scheme == "https" and parsed_coordinate_source.netloc, f"Fuente de coordenadas no HTTPS: {node['name']}"
              key = " ".join(node["name"].split()).casefold()
              assert key not in names, f"Nodo duplicado (ignorando mayúsculas y espacios): {node['name']}"
              names.add(key)

          expected_jurisdictions = {
              "CABA", "Buenos Aires", "Catamarca", "Chaco", "Chubut", "Córdoba",
              "Corrientes", "Entre Ríos", "Formosa", "Jujuy", "La Pampa", "La Rioja",
              "Mendoza", "Misiones", "Neuquén", "Río Negro", "Salta", "San Juan",
              "San Luis", "Santa Cruz", "Santa Fe", "Santiago del Estero",
              "Tierra del Fuego", "Tucumán"
          }
          covered_jurisdictions = {node["province"] for node in nodes}
          missing_jurisdictions = expected_jurisdictions - covered_jurisdictions
          assert not missing_jurisdictions, f"Faltan jurisdicciones en el catálogo: {sorted(missing_jurisdictions)}"
          assert provincial_data.get("period") == "2025", "El período del dataset provincial debe ser 2025"
          assert provincial_data.get("publisher") == "INDEC", "La fuente de exportaciones provinciales debe ser INDEC"
          assert isinstance(provincial_data.get("profileYear"), str) and provincial_data["profileYear"].isdigit(), "Falta el año de edición de las fichas complementarias"
          assert isinstance(provincial_data.get("profilePublisher"), str) and provincial_data["profilePublisher"].strip(), "Falta el organismo publicador de las fichas complementarias"
          profile_index = urlparse(provincial_data.get("profileIndexUrl", ""))
          assert profile_index.scheme == "https" and profile_index.netloc, "El índice de fichas complementarias debe tener fuente HTTPS"
          assert isinstance(provincial_data.get("published"), str), "Falta fecha de publicación del dataset provincial"
          verification = provincial_data.get("verification")
          assert isinstance(verification, dict), "Falta el registro de verificación del dataset provincial"
          assert verification.get("status") in {"verified", "not_verified", "outdated"}, "Estado de verificación provincial no admitido"
          assert isinstance(verification.get("checkedAt"), str), "Falta fecha de verificación provincial"
          verification_date = date.fromisoformat(verification["checkedAt"])
          assert verification_date <= date.today(), "La fecha de verificación provincial no puede ser futura"
          assert isinstance(verification.get("scope"), str) and verification["scope"].strip(), "Falta el alcance de verificación provincial"
          source_url = urlparse(provincial_data.get("sourceUrl", ""))
          assert source_url.scheme == "https" and source_url.netloc, "Fuente OPEX no HTTPS"
          province_profiles = provincial_data.get("profiles")
          assert isinstance(province_profiles, list) and len(province_profiles) == 24, "Se requieren 24 perfiles provinciales"
          profile_names = set()
          allowed_regions = {"Pampeana", "Patagonia", "NOA", "Cuyo", "NEA"}
          for profile in province_profiles:
              for field in ("province", "region", "profileUrl"):
                  assert isinstance(profile.get(field), str) and profile[field].strip(), f"Perfil provincial sin {field}"
              assert profile["region"] in allowed_regions, f"Región no admitida: {profile['region']}"
              assert profile["province"] not in profile_names, f"Perfil provincial duplicado: {profile['province']}"
              profile_names.add(profile["province"])
              assert isinstance(profile.get("exportsUsdMillions"), (int, float)) and profile["exportsUsdMillions"] >= 0, f"Exportaciones inválidas: {profile['province']}"
              assert isinstance(profile.get("yearOnYearPct"), (int, float)), f"Variación interanual inválida: {profile['province']}"
              assert isinstance(profile.get("nationalSharePct"), (int, float)) and 0 <= profile["nationalSharePct"] <= 100, f"Participación inválida: {profile['province']}"
              profile_url = urlparse(profile["profileUrl"])
              assert profile_url.scheme == "https" and profile_url.netloc, f"Ficha provincial no HTTPS: {profile['province']}"
          assert profile_names == expected_jurisdictions, f"Los perfiles no cubren exactamente las 24 jurisdicciones: {sorted(expected_jurisdictions - profile_names)}"

          categories = {"Economía", "Empresas", "Comercio", "Infraestructura", "Regulación", "Tecnología"}

          def canonical_news_url(raw_url):
              parsed = urlparse(raw_url)
              scheme = parsed.scheme.lower()
              if parsed.username is not None or parsed.password is not None:
                  raise ValueError("Las URLs editoriales no deben incluir credenciales")
              hostname = parsed.hostname
              if not hostname:
                  raise ValueError("La URL editorial debe incluir un host")
              port = parsed.port
              host = hostname.lower()
              if ":" in host and not host.startswith("["):
                  host = f"[{host}]"
              netloc = host if port in (None, 443) else f"{host}:{port}"
              return parsed._replace(
                  scheme=scheme,
                  netloc=netloc,
                  path=parsed.path or "/",
                  fragment=""
              ).geturl()

          assert canonical_news_url("HTTPS://Example.COM:443#seccion") == "https://example.com/"
          assert canonical_news_url("https://example.com") == canonical_news_url("https://example.com/")
          assert canonical_news_url("https://example.com:8443/noticia") == "https://example.com:8443/noticia"
          assert canonical_news_url("https://example.com/noticia?id=1") != canonical_news_url("https://example.com/noticia?id=2")
          try:
              canonical_news_url("https://usuario:clave@example.com/noticia")
          except ValueError:
              pass
          else:
              raise AssertionError("No se rechazó una URL editorial con credenciales")

          def validate_news_verification(item):
              verification = item.get("verification")
              assert isinstance(verification, dict), f"Noticia sin estado de verificación: {item.get('title', 'sin titular')}"
              verification_status = verification.get("status")
              assert verification_status in {"editorial_reviewed", "pending", "not_verified", "outdated"}, f"Estado de verificación no admitido: {item.get('title', 'sin titular')}"
              assert isinstance(verification.get("scope"), str) and verification["scope"].strip(), f"Verificación sin alcance: {item.get('title', 'sin titular')}"
              checked_at = verification.get("checkedAt")
              if verification_status == "editorial_reviewed":
                  assert isinstance(checked_at, str), f"Revisión editorial sin fecha: {item.get('title', 'sin titular')}"
              else:
                  assert checked_at is None or isinstance(checked_at, str), f"Fecha de verificación inválida: {item.get('title', 'sin titular')}"
              if checked_at is not None:
                  checked_date = date.fromisoformat(checked_at)
                  assert checked_date.isoformat() == checked_at, f"Fecha de verificación no ISO: {item.get('title', 'sin titular')}"
                  published_date = date.fromisoformat(item["date"])
                  assert published_date <= checked_date <= date.today(), f"Fecha de verificación anterior a la publicación o futura: {item.get('title', 'sin titular')}"

          verification_fixture = {
              "title": "Fixture de trazabilidad editorial",
              "date": "2026-11-20",
              "verification": {
                  "status": "editorial_reviewed",
                  "checkedAt": "2026-11-21",
                  "scope": "Prueba sintética del contrato de verificación."
              }
          }
          validate_news_verification(verification_fixture)
          pending_fixture = {
              "title": "Fixture pendiente",
              "date": "2026-11-20",
              "verification": {
                  "status": "pending",
                  "checkedAt": None,
                  "scope": "Pendiente de revisión editorial."
              }
          }
          validate_news_verification(pending_fixture)
          for invalid_checked_at in ("2026-11-19", "2026-11-21T00:00:00", "2026-11-23"):
              invalid_fixture = {
                  **verification_fixture,
                  "verification": {**verification_fixture["verification"], "checkedAt": invalid_checked_at}
              }
              try:
                  validate_news_verification(invalid_fixture)
              except (AssertionError, ValueError):
                  pass
              else:
                  raise AssertionError(f"Se aceptó una fecha de verificación inválida: {invalid_checked_at}")
          print("Trazabilidad editorial: fechas ISO, posteriores a la publicación y no futuras; estados pendientes admitidos.")

          def validate_news_summary(item):
              assert len(item["summary"]) <= 700, f"Síntesis demasiado extensa: {item['title']}"

          summary_fixture = {"title": "Fixture de síntesis editorial", "summary": "x" * 700}
          validate_news_summary(summary_fixture)
          try:
              validate_news_summary({**summary_fixture, "summary": "x" * 701})
          except AssertionError:
              pass
          else:
              raise AssertionError("Se aceptó una síntesis de más de 700 caracteres")

          def validate_news_period(item):
              assert isinstance(item.get("period"), str) and item["period"].strip(), f"Período no explícito: {item.get('title', 'fixture')}"

          period_fixture = {"title": "Fixture de período editorial", "period": "No consignado en el registro editorial"}
          validate_news_period(period_fixture)
          for invalid_period_fixture in (
              {**period_fixture, "period": None},
              {"title": period_fixture["title"]},
              {**period_fixture, "period": "   "}
          ):
              try:
                  validate_news_period(invalid_period_fixture)
              except AssertionError:
                  pass
              else:
                  raise AssertionError("Se aceptó un período editorial ausente o vacío")

          news_urls = set()
          news_titles = set()
          for item in news:
              for field in ("title", "date", "category", "summary", "source", "url"):
                  assert isinstance(item.get(field), str) and item[field].strip(), f"Noticia sin {field}"
              date.fromisoformat(item["date"])
              assert item["date"] <= date.today().isoformat(), f"Noticia con fecha futura: {item['title']}"
              assert item["category"] in categories, f"Categoría no admitida: {item['category']}"
              validate_news_summary(item)
              validate_news_period(item)
              validate_news_verification(item)
              url = urlparse(item["url"])
              assert url.scheme == "https" and url.netloc, f"URL de noticia no HTTPS: {item['title']}"
              related_sources = item.get("relatedSources", [])
              assert isinstance(related_sources, list), f"Fuentes complementarias inválidas: {item['title']}"
              related_labels = set()
              for related_source in related_sources:
                  assert isinstance(related_source, dict), f"Fuente complementaria inválida: {item['title']}"
                  assert isinstance(related_source.get("label"), str) and related_source["label"].strip(), f"Fuente complementaria sin etiqueta: {item['title']}"
                  related_url = urlparse(related_source.get("url", ""))
                  assert related_url.scheme == "https" and related_url.netloc, f"Fuente complementaria no HTTPS: {item['title']}"
                  assert related_source["label"] not in related_labels, f"Etiqueta de fuente complementaria duplicada: {item['title']}"
                  related_labels.add(related_source["label"])
              canonical_url = canonical_news_url(item["url"])
              assert canonical_url not in news_urls, f"Noticia duplicada por URL canónica: {item['url']}"
              news_urls.add(canonical_url)
              title_key = " ".join(item["title"].split()).casefold()
              assert title_key not in news_titles, f"Titular duplicado: {item['title']}"
              news_titles.add(title_key)

          assert [item["date"] for item in news] == sorted((item["date"] for item in news), reverse=True), "Las noticias deben estar ordenadas de más recientes a más antiguas"

          # Event Intelligence: contrato de datos preparado, sin simular una agenda activa.
          assert event_catalog.get("schemaVersion") == 1, "Versión de esquema de eventos no admitida"
          catalog_updated = date.fromisoformat(event_catalog.get("updatedAt", ""))
          assert catalog_updated.isoformat() == event_catalog["updatedAt"], "Fecha de actualización de eventos no ISO"
          assert catalog_updated <= date.today(), "Fecha futura en catálogo de eventos"
          assert isinstance(event_catalog.get("note"), str) and event_catalog["note"].strip(), "Falta la nota de alcance del catálogo de eventos"
          events = event_catalog.get("events")
          assert isinstance(events, list), "El catálogo de eventos debe contener una lista"
          event_ids = set()
          event_statuses = {"confirmed", "rescheduled", "cancelled", "completed"}
          event_verification_statuses = {"verified", "outdated"}
          event_scopes = {"local", "regional", "national", "virtual"}

          def validate_event(event):
              required = ("id", "name", "startDate", "endDate", "time", "timeZone", "scope", "jurisdiction", "venue", "organizer", "sector", "sourceName", "sourceUrl", "sourcePublishedAt", "period", "status", "verification")
              for field in required:
                  assert field in event, f"Evento sin campo {field}"
              for field in ("id", "name", "startDate", "timeZone", "scope", "venue", "organizer", "sector", "sourceName", "sourceUrl", "sourcePublishedAt", "status"):
                  assert isinstance(event[field], str) and event[field].strip(), f"Evento con {field} vacío"
              start_date = date.fromisoformat(event["startDate"])
              assert start_date.isoformat() == event["startDate"], f"Fecha de inicio no ISO: {event['id']}"
              end_date = event["endDate"]
              if end_date is not None:
                  parsed_end = date.fromisoformat(end_date)
                  assert parsed_end.isoformat() == end_date and parsed_end >= start_date, f"Rango de fechas inválido: {event['id']}"
              if event["time"] is not None:
                  parsed_time = time.fromisoformat(event["time"])
                  assert parsed_time.strftime("%H:%M") == event["time"], f"Hora inválida (usar HH:MM): {event['id']}"
              try:
                  ZoneInfo(event["timeZone"])
              except ZoneInfoNotFoundError:
                  raise AssertionError(f"Zona horaria IANA no reconocida: {event['timeZone']}")
              assert event["scope"] in event_scopes, f"Alcance de evento no admitido: {event['scope']}"
              jurisdiction = event["jurisdiction"]
              assert jurisdiction is None or jurisdiction in expected_jurisdictions, f"Jurisdicción de evento no admitida: {jurisdiction}"
              if event["scope"] in {"local", "regional"}:
                  assert jurisdiction is not None, f"Evento local/regional sin jurisdicción: {event['id']}"
              assert event["period"] is None or (isinstance(event["period"], str) and event["period"].strip()), f"Período de evento inválido: {event['id']}"
              assert event["status"] in event_statuses, f"Estado de evento no admitido: {event['id']}"
              source_url = urlparse(event["sourceUrl"])
              assert source_url.scheme == "https" and source_url.hostname and source_url.username is None and source_url.password is None, f"Fuente oficial de evento inválida: {event['id']}"
              published = date.fromisoformat(event["sourcePublishedAt"])
              assert published.isoformat() == event["sourcePublishedAt"], f"Fecha de publicación de fuente no ISO: {event['id']}"
              verification = event["verification"]
              assert isinstance(verification, dict), f"Verificación de evento inválida: {event['id']}"
              assert verification.get("status") in event_verification_statuses, f"Estado de verificación de evento no admitido: {event['id']}"
              checked_at = date.fromisoformat(verification.get("checkedAt", ""))
              assert checked_at.isoformat() == verification["checkedAt"], f"Fecha de verificación no ISO: {event['id']}"
              assert published <= checked_at <= date.today(), f"Fechas de fuente/verificación inconsistentes: {event['id']}"
              assert isinstance(verification.get("scope"), str) and verification["scope"].strip(), f"Evento sin alcance de verificación: {event['id']}"
              last_event_day = date.fromisoformat(end_date) if end_date else start_date
              if event["status"] in {"confirmed", "rescheduled"}:
                  assert verification["status"] == "verified", f"Evento futuro no confirmado por fuente oficial: {event['id']}"
                  assert last_event_day >= date.today(), f"Evento vencido todavía marcado como próximo: {event['id']}"
              if event["status"] == "completed":
                  assert last_event_day <= date.today(), f"Evento marcado como completado tiene fecha futura: {event['id']}"
              return event["id"].strip().casefold()

          for event in events:
              event_key = validate_event(event)
              assert event_key not in event_ids, f"ID de evento duplicado: {event['id']}"
              event_ids.add(event_key)

          # Fixtures sintéticos: prueban el contrato sin publicar eventos ficticios.
          sample_event = {
              "id": "fixture-evento",
              "name": "Evento de prueba",
              "startDate": "2026-12-10",
              "endDate": None,
              "time": "10:30",
              "timeZone": "America/Argentina/Buenos_Aires",
              "scope": "local",
              "jurisdiction": "Buenos Aires",
              "venue": "Sede de prueba",
              "organizer": "Organizador de prueba",
              "sector": "Tecnología",
              "sourceName": "Fuente de prueba",
              "sourceUrl": "https://example.org/evento",
              "sourcePublishedAt": "2026-11-20",
              "period": None,
              "status": "confirmed",
              "verification": {
                  "status": "verified",
                  "checkedAt": "2026-11-21",
                  "scope": "Fixture sintético para validar campos y fechas."
              }
          }
          validate_event(sample_event)
          for invalid_fixture in (
              {**sample_event, "sourceUrl": "http://example.org/evento"},
              {**sample_event, "endDate": "2026-12-09"},
              {**sample_event, "startDate": "2026-11-20"},
              {**sample_event, "status": "completed"},
              {**sample_event, "verification": {**sample_event["verification"], "status": "outdated"}}
          ):
              try:
                  validate_event(invalid_fixture)
              except (AssertionError, ValueError):
                  pass
              else:
                  raise AssertionError("Se aceptó un fixture de evento inválido")
          print(f"Catálogo de eventos válido: {len(events)} registros verificados; esquema y fixtures comprobados.")

          # Investment Finder: contrato verificable, sin inferir oportunidades desde exportaciones o infraestructura.
          assert investment_catalog.get("schemaVersion") == 2, "Versión de esquema de oportunidades no admitida"
          investment_updated = date.fromisoformat(investment_catalog.get("updatedAt", ""))
          assert investment_updated.isoformat() == investment_catalog["updatedAt"] and investment_updated <= date.today(), "Fecha de actualización inválida en oportunidades"
          assert isinstance(investment_catalog.get("note"), str) and investment_catalog["note"].strip(), "Falta la nota de alcance del catálogo de oportunidades"
          opportunities = investment_catalog.get("opportunities")
          assert isinstance(opportunities, list), "El catálogo de oportunidades debe contener una lista"
          opportunity_ids = set()
          opportunity_types = {"project", "public_program", "tender", "incentive"}
          opportunity_scopes = {"national", "provincial"}
          opportunity_stages = {"announced", "feasibility", "preparation", "under_construction", "operational", "completed", "cancelled", "unknown"}
          opportunity_statuses = {"open", "closed", "suspended", "unknown"}
          verification_statuses = {"verified", "not_verified", "outdated"}

          def validate_opportunity(opportunity):
              required = ("id", "name", "recordType", "scope", "sector", "jurisdiction", "location", "stage", "opportunityStatus", "amount", "validFrom", "validUntil", "sourceName", "sourceUrl", "sourcePublishedAt", "period", "verification")
              for field in required:
                  assert field in opportunity, f"Oportunidad sin campo {field}"
              for field in ("id", "name", "recordType", "sector", "stage", "opportunityStatus", "sourceName", "sourceUrl", "sourcePublishedAt"):
                  assert isinstance(opportunity[field], str) and opportunity[field].strip(), f"Oportunidad con {field} vacío"
              assert opportunity["recordType"] in opportunity_types, f"Tipo de registro no admitido: {opportunity['id']}"
              assert opportunity["scope"] in opportunity_scopes, f"Alcance territorial no admitido: {opportunity['id']}"
              assert opportunity["stage"] in opportunity_stages, f"Etapa no admitida: {opportunity['id']}"
              assert opportunity["opportunityStatus"] in opportunity_statuses, f"Estado de oportunidad no admitido: {opportunity['id']}"
              if opportunity["scope"] == "national":
                  assert opportunity["jurisdiction"] is None, f"Una oportunidad nacional no debe asignarse a una provincia: {opportunity['id']}"
              else:
                  assert opportunity["jurisdiction"] in expected_jurisdictions, f"Jurisdicción provincial no admitida: {opportunity['id']}"
              location = opportunity["location"]
              assert location is None or (isinstance(location, str) and location.strip()), f"Ubicación inválida: {opportunity['id']}"
              source_url = urlparse(opportunity["sourceUrl"])
              assert source_url.scheme == "https" and source_url.hostname and source_url.username is None and source_url.password is None, f"Fuente de oportunidad inválida: {opportunity['id']}"
              source_published = date.fromisoformat(opportunity["sourcePublishedAt"])
              assert source_published.isoformat() == opportunity["sourcePublishedAt"] and source_published <= date.today(), f"Fecha de publicación de fuente inválida: {opportunity['id']}"
              assert opportunity["period"] is None or (isinstance(opportunity["period"], str) and opportunity["period"].strip()), f"Período inválido: {opportunity['id']}"
              valid_from = opportunity["validFrom"]
              valid_until = opportunity["validUntil"]
              if valid_from is not None:
                  valid_from = date.fromisoformat(valid_from)
                  assert valid_from.isoformat() == opportunity["validFrom"], f"Inicio de vigencia no ISO: {opportunity['id']}"
              if valid_until is not None:
                  valid_until = date.fromisoformat(valid_until)
                  assert valid_until.isoformat() == opportunity["validUntil"], f"Fin de vigencia no ISO: {opportunity['id']}"
              if valid_from is not None and valid_until is not None:
                  assert valid_until >= valid_from, f"Vigencia invertida: {opportunity['id']}"
              amount = opportunity["amount"]
              if amount is not None:
                  assert isinstance(amount, dict), f"Monto inválido: {opportunity['id']}"
                  amount_value = amount.get("value")
                  assert isinstance(amount_value, (int, float)) and not isinstance(amount_value, bool) and amount_value >= 0, f"Valor monetario inválido: {opportunity['id']}"
                  assert not isinstance(amount_value, float) or math.isfinite(amount_value), f"El monto debe ser finito: {opportunity['id']}"
                  currency = amount.get("currency")
                  assert isinstance(currency, str) and len(currency) == 3 and currency.isascii() and currency.isalpha() and currency.isupper(), f"Moneda inválida: {opportunity['id']}"
                  assert isinstance(amount.get("basis"), str) and amount["basis"].strip(), f"Falta la base del monto: {opportunity['id']}"
              verification = opportunity["verification"]
              assert isinstance(verification, dict), f"Verificación inválida: {opportunity['id']}"
              assert verification.get("status") in verification_statuses, f"Estado de verificación no admitido: {opportunity['id']}"
              assert isinstance(verification.get("scope"), str) and verification["scope"].strip(), f"Falta el alcance de verificación: {opportunity['id']}"
              checked_at = verification.get("checkedAt")
              if verification["status"] == "verified":
                  assert isinstance(checked_at, str), f"Oportunidad verificada sin fecha: {opportunity['id']}"
              else:
                  assert checked_at is None or isinstance(checked_at, str), f"Fecha de verificación inválida: {opportunity['id']}"
              if checked_at is not None:
                  checked_date = date.fromisoformat(checked_at)
                  assert checked_date.isoformat() == checked_at and source_published <= checked_date <= date.today(), f"Fecha de verificación inconsistente: {opportunity['id']}"
              if opportunity["opportunityStatus"] == "open":
                  assert verification["status"] == "verified" and checked_at is not None, f"Oportunidad abierta sin verificación vigente registrada: {opportunity['id']}"
                  assert valid_from is not None and valid_from <= date.today(), f"Oportunidad abierta sin inicio de vigencia válido: {opportunity['id']}"
                  assert valid_until is None or valid_until >= date.today(), f"Oportunidad vencida marcada como abierta: {opportunity['id']}"
                  assert opportunity["stage"] not in {"completed", "cancelled"}, f"Proyecto finalizado marcado como oportunidad abierta: {opportunity['id']}"
              return opportunity["id"].strip().casefold()

          for opportunity in opportunities:
              opportunity_key = validate_opportunity(opportunity)
              assert opportunity_key not in opportunity_ids, f"ID de oportunidad duplicado: {opportunity['id']}"
              opportunity_ids.add(opportunity_key)
          rimi = next((item for item in opportunities if item["id"] == "rimi-eficiencia-energetica-2026"), None)
          assert rimi is not None and rimi["scope"] == "national" and rimi["jurisdiction"] is None, "Falta el registro RIMI de alcance nacional"
          assert rimi["opportunityStatus"] == "unknown", "RIMI no debe mostrarse como oportunidad abierta sin verificar el trámite SGI"

          # Fixture sintético: valida el contrato sin publicar una oportunidad real.
          sample_opportunity = {
              "id": "fixture-programa",
              "name": "Programa de prueba",
              "recordType": "public_program",
              "scope": "provincial",
              "sector": "Industria",
              "jurisdiction": "Buenos Aires",
              "location": None,
              "stage": "announced",
              "opportunityStatus": "open",
              "amount": None,
              "validFrom": "2026-11-21",
              "validUntil": None,
              "sourceName": "Fuente sintética",
              "sourceUrl": "https://example.org/oportunidad",
              "sourcePublishedAt": "2026-11-20",
              "period": None,
              "verification": {
                  "status": "verified",
                  "checkedAt": "2026-11-21",
                  "scope": "Fixture sintético para probar el contrato de trazabilidad."
              }
          }
          validate_opportunity(sample_opportunity)
          national_fixture = {**sample_opportunity, "id": "fixture-nacional", "scope": "national", "jurisdiction": None}
          validate_opportunity(national_fixture)
          invalid_opportunities = (
              {**sample_opportunity, "sourceUrl": "http://example.org/oportunidad"},
              {**sample_opportunity, "jurisdiction": "Atlantis"},
              {**sample_opportunity, "scope": "national"},
              {**sample_opportunity, "scope": "provincial", "jurisdiction": None},
              {**sample_opportunity, "scope": "municipal"},
              {**sample_opportunity, "sourcePublishedAt": "2026-11-23"},
              {**sample_opportunity, "verification": {**sample_opportunity["verification"], "checkedAt": "2026-11-19"}},
              {**sample_opportunity, "verification": {**sample_opportunity["verification"], "status": "outdated"}},
              {**sample_opportunity, "validUntil": "2026-11-20"},
              {**sample_opportunity, "amount": {"value": -1, "currency": "USD", "basis": "Monto total"}},
              {**sample_opportunity, "amount": {"value": float("inf"), "currency": "USD", "basis": "Monto total"}},
              {**sample_opportunity, "amount": {"value": 100, "currency": "ÅBC", "basis": "Monto total"}},
              {**sample_opportunity, "amount": {"value": 100, "currency": "usd", "basis": "Monto total"}}
          )
          for invalid_opportunity in invalid_opportunities:
              try:
                  validate_opportunity(invalid_opportunity)
              except (AssertionError, ValueError):
                  pass
              else:
                  raise AssertionError("Se aceptó un fixture de oportunidad inválido")
          print(f"Investment Finder válido: {len(opportunities)} registros; contrato, vigencia, fuentes y fixtures comprobados.")

          ibicuy = next((node for node in nodes if node["name"] == "Puerto de Ibicuy"), None)
          assert ibicuy and ibicuy["province"] == "Entre Ríos", "Falta el nodo oficial Puerto de Ibicuy"
          assert ibicuy.get("coordinateSource") == ibicuy["source"], "La fuente de coordenadas de Ibicuy debe estar declarada"
          print(f"Validación correcta: {len(nodes)} nodos en {len(covered_jurisdictions)} jurisdicciones y {len(news)} noticias.")
          PY
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I | re.S)
          assert scripts, "No se encontró JavaScript de aplicación"
          Path("/tmp/mapafederal-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/mapafederal-inline.js
      - name: Test Investment Finder filters and provenance
        run: |
          node - <<'JS'
          const fs = require("fs");
          const vm = require("vm");
          const html = fs.readFileSync("index.html", "utf8");
          const catalog = JSON.parse(fs.readFileSync("data/investment-opportunities.json", "utf8"));
          for (const id of ["investment-search", "investment-sector", "investment-scope", "investment-jurisdiction", "investment-status", "investment-count", "investment-grid"]) {
            if (!html.includes('id="' + id + '"')) throw new Error("Falta el control de Investment Finder: " + id);
          }
          if (!html.includes("registros documentados")) throw new Error("Falta la etiqueta traducible del contador.");
          const start = html.indexOf("function filterInvestmentOpportunities(records,filters){");
          const end = html.indexOf("\nfunction investmentStatusLabel", start);
          if (start < 0 || end < 0) throw new Error("No se encontró el filtro reutilizable de Investment Finder.");
          const normalizeText = value => String(value ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase("es").trim();
          const filter = vm.runInNewContext("(" + html.slice(start, end) + ")", { normalizeText });
          const record = catalog.opportunities[0];
          if (!record || record.opportunityStatus !== "unknown") throw new Error("El registro documental RIMI debe conservar disponibilidad desconocida.");
          const base = { query: "eficiencia energética", sector: "all", scope: "national", jurisdiction: "Nacional", status: "unknown" };
          if (filter(catalog.opportunities, base).length !== 1) throw new Error("No se encontró el registro nacional mediante búsqueda y filtros combinados.");
          if (filter(catalog.opportunities, { ...base, status: "open" }).length !== 0) throw new Error("El registro RIMI no debe aparecer como oportunidad abierta.");
          if (filter(catalog.opportunities, { ...base, scope: "provincial" }).length !== 0) throw new Error("El filtro provincial incluyó un registro nacional.");
          if (filter(catalog.opportunities, { ...base, jurisdiction: "Buenos Aires" }).length !== 0) throw new Error("El filtro de jurisdicción incluyó un registro nacional.");
          if (filter(catalog.opportunities, { ...base, query: "boletin oficial" }).length !== 1) throw new Error("La búsqueda no encuentra la fuente documental.");
          for (const field of ["sourceName", "sourceUrl", "sourcePublishedAt", "period", "validFrom", "verification"]) {
            if (!record[field]) throw new Error("El registro carece de trazabilidad: " + field);
          }
          if (!record.sourceUrl.startsWith("https://") || !record.verification.checkedAt || !record.verification.scope) {
            throw new Error("La fuente y el alcance/fecha de verificación deben permanecer visibles.");
          }
          console.log("Investment Finder: filtros locales, alcance nacional, estado desconocido y trazabilidad comprobados.");
          JS

      - name: Test CSV formula-injection protection
        run: |
          node - <<'JS'
          const fs = require("fs");
          const vm = require("vm");
          const html = fs.readFileSync("index.html", "utf8");
          const start = html.indexOf("function csvCell(value){");
          const end = html.indexOf("\nfunction downloadCsv", start);
          if (start < 0 || end < 0) throw new Error("No se encontró csvCell para probar.");
          const csvCell = vm.runInNewContext("(" + html.slice(start, end) + ")");
          if (csvCell("=1+1").charAt(1) !== "'") throw new Error("No se neutralizó una fórmula con =.");
          if (csvCell("  +SUM(A1:A2)").charAt(1) !== "'") throw new Error("No se neutralizó una fórmula precedida por espacios.");
          if (csvCell("@SUM(1,2)").charAt(1) !== "'") throw new Error("No se neutralizó una fórmula con @.");
          if (csvCell(-34.6) !== '"' + String(-34.6) + '"') throw new Error("Se alteró un valor numérico negativo.");
          console.log("CSV seguro: fórmulas neutralizadas y valores numéricos preservados.");
          JS

      - name: Test provincial CSV provenance
        run: |
          node - <<'JS'
          const fs = require("fs");
          const vm = require("vm");
          const html = fs.readFileSync("index.html", "utf8");
          const start = html.indexOf("function exportVisibleProfiles(){");
          const end = html.indexOf("\nfunction exportProvinceBrief", start);
          if (start < 0 || end < 0) throw new Error("No se encontró exportVisibleProfiles para probar.");
          let captured;
          const context = {
            document: { getElementById(id) { return { value: id === "profile-search" ? "" : "Todas" }; } },
            normalizeText(value) { return String(value ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); },
            provincialProfiles: [{ province: "Buenos Aires", region: "Pampeana", exportsUsdMillions: 31684, yearOnYearPct: 7.3, nationalSharePct: 36.4, profileUrl: "https://example.gov/profile.pdf" }],
            profilesMetadata: { period: "2025", profileYear: "2025", profilePublisher: "Ministerio de Economía — Panel de Indicadores Provinciales", profileIndexUrl: "https://example.gov/profiles", published: "2026-03-10", publisher: "INDEC", sourceUrl: "https://example.gov/opex.pdf", verification: { status: "verified", checkedAt: "2026-11-21", scope: "Test scope" } },
            downloadCsv(...args) { captured = args; }
          };
          const exportProfiles = vm.runInNewContext("(" + html.slice(start, end) + ")", context);
          exportProfiles();
          if (!captured) throw new Error("No se generó la exportación provincial.");
          const [filename, headers, rows] = captured;
          const requiredHeaders = ["Publicación de la fuente estadística", "Organismo publicador estadístico", "Estado de verificación estadística", "Fecha de verificación estadística", "Alcance de verificación estadística", "Fuente estadística", "Año de edición de ficha complementaria", "Nota sobre período de ficha complementaria"];
          for (const header of requiredHeaders) if (!headers.includes(header)) throw new Error("Falta columna de trazabilidad: " + header);
          const requiredValues = ["2025", "2026-03-10", "INDEC", "Verificado", "2026-11-21", "Test scope", "https://example.gov/opex.pdf"];
          for (const value of requiredValues) if (!rows[0].includes(value)) throw new Error("Falta valor de trazabilidad: " + value);
          if (rows[0][headers.indexOf("Año de edición de ficha complementaria")] !== "2025") throw new Error("Falta el año de edición de la ficha complementaria.");
          if (!rows[0][headers.indexOf("Nota sobre período de ficha complementaria")].includes("no garantiza")) throw new Error("Falta la advertencia de período de la ficha complementaria.");
          console.log("CSV provincial conserva trazabilidad OPEX y separa el año de edición de la ficha complementaria.");

          (async () => {
            const reportStart = html.indexOf("function exportProvinceBrief(){");
            const reportEnd = html.indexOf('\ndocument.getElementById("brief-province").addEventListener', reportStart);
            if (reportStart < 0 || reportEnd < 0) throw new Error("No se encontró exportProvinceBrief para probar.");
            let capturedBlob;
            const link = { click(){}, remove(){} };
            const reportContext = {
              document: {
                getElementById(id) {
                  if (id === "brief-province") return { value: "Buenos Aires" };
                  if (id === "brief-export-status") return { textContent: "" };
                  throw new Error("Elemento inesperado: " + id);
                },
                createElement() { return link; },
                body: { appendChild(){} }
              },
              URL: { createObjectURL(blob) { capturedBlob = blob; return "blob:test"; }, revokeObjectURL(){} },
              Blob,
              window: { setTimeout(){} },
              provincialProfiles: context.provincialProfiles,
              profilesMetadata: context.profilesMetadata,
              points: [{ name: "Puerto de prueba", province: "Buenos Aires", type: "Puerto", note: "Nodo de prueba", coords: [-34.6, -58.4], source: "https://example.gov/port", coordinateSource: "https://example.gov/map" }]
            };
            const exportReport = vm.runInNewContext("(" + html.slice(reportStart, reportEnd) + ")", reportContext);
            exportReport();
            if (!capturedBlob) throw new Error("No se generó el informe territorial.");
            const markdown = await capturedBlob.text();
            for (const value of ["Año de edición de ficha complementaria: 2025", "no garantiza que todos sus indicadores", "Ministerio de Economía — Panel de Indicadores Provinciales", "https://example.gov/profile.pdf"]) {
              if (!markdown.includes(value)) throw new Error("El informe no conserva la aclaración o fuente: " + value);
            }
            console.log("Federal Reports: informe Markdown incluye año de edición, advertencia de período y fuente complementaria.");
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS

