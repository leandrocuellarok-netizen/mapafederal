                  assert isinstance(checked_at, str), f"Revisión editorial sin fecha: {item.get('title', 'sin titular')}"
              else:
                  assert checked_at is None or isinstance(checked_at, str), f"Fecha de verificación inválida: {item.get('title', 'sin titular')}"
              if checked_at is not None:
                  checked_date = date.fromisoformat(checked_at)
                  assert checked_date.isoformat() == checked_at, f"Fecha de verificación no ISO: {item.get('title', 'sin titular')}"
                  published_date = date.fromisoformat(item["date"])
                  assert published_date <= checked_date <= date.today(), f"Fecha de verificación anterior a la publicación o futura: {item.get('title', 'sin titular')}"

