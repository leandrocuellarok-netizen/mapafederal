          const fs = require("fs");
          const vm = require("vm");
          const html = fs.readFileSync("index.html", "utf8");
          const i18n = fs.readFileSync("assets/i18n.js", "utf8");
          const news = JSON.parse(fs.readFileSync("data/news.json", "utf8"));
          for (const id of ["news-search", "news-category", "news-jurisdiction", "news-grid"]) {
            if (!html.includes('id="' + id + '"')) throw new Error("Falta el control editorial: " + id);
          }
          if (!html.includes("populateNewsJurisdictionFilter")) throw new Error("No se genera el filtro desde el catálogo.");
          if (!i18n.includes('"Jurisdicciones mencionadas:"') || !i18n.includes('"Jurisdicción provincial no especificada"')) throw new Error("Faltan traducciones territoriales.");
          for (const item of news) {
            if (!Array.isArray(item.jurisdictions) || !Array.isArray(item.geographyEvidence)) throw new Error("Noticia sin metadatos geográficos: " + item.title);
            if (item.geographyStatus === "explicit" && (!item.jurisdictions.length || !item.geographyEvidence.length)) throw new Error("Clasificación explícita incompleta: " + item.title);
            if (item.geographyStatus === "not_specified" && (item.jurisdictions.length || item.geographyEvidence.length)) throw new Error("Se asignó ubicación a un registro ambiguo: " + item.title);
          }
          const start = html.indexOf("function filterNewsItems(items,filters){");
          const end = html.indexOf("\nfunction populateNewsJurisdictionFilter", start);
          if (start < 0 || end < 0) throw new Error("No se encontró el filtro territorial reutilizable.");
          const normalizeText = value => String(value ?? "").toLowerCase().trim();
          const filter = vm.runInNewContext("(" + html.slice(start, end) + ")", { normalizeText });
          const base = { query: "", category: "Todas", jurisdiction: "all" };
          const ush = filter(news, { ...base, jurisdiction: "Tierra del Fuego" });
          if (ush.length !== 1 || !ush[0].title.startsWith("Ushuaia:")) throw new Error("No se localizó Ushuaia en Tierra del Fuego.");
          const chubut = filter(news, { ...base, jurisdiction: "Chubut" });
          if (chubut.length !== 2 || !chubut.some(item => item.title.startsWith("Proyecto Navidad:")) || !chubut.some(item => item.title.startsWith("Chubut:"))) throw new Error("No se localizaron las noticias verificadas de Chubut.");
          const buenosAires = filter(news, { ...base, jurisdiction: "Buenos Aires" });
          if (!buenosAires.some(item => item.title.startsWith("Toyota anunció"))) throw new Error("No se localizó Zárate en Buenos Aires.");
          if (filter(news, { ...base, jurisdiction: "CABA" }).length !== 1) throw new Error("CABA y provincia de Buenos Aires no se distinguen.");
          if (filter(news, { ...base, jurisdiction: "Entre Ríos" }).length !== 1) throw new Error("No se localizó Concepción del Uruguay.");
          if (filter(news, { ...base, category: "Empresas", jurisdiction: "Tierra del Fuego" }).length !== 0) throw new Error("Los filtros combinados no son restrictivos.");
          console.log("Territorial Monitor: filtro territorial, filtros combinados, registros ambiguos y traducciones comprobados.");
          JS

      - name: Test Investment Finder filters and provenance
        run: |
          node - <<'JS'
          const fs = require("fs");
          const vm = require("vm");
          const html = fs.readFileSync("investment-finder/index.html", "utf8");
          const catalog = JSON.parse(fs.readFileSync("data/investment-opportunities.json", "utf8"));
          for (const id of ["investment-search", "investment-sector", "investment-scope", "investment-jurisdiction", "investment-stage", "investment-status", "investment-verification", "investment-count", "investment-grid"]) {
            if (!html.includes('id="' + id + '"')) throw new Error("Falta el control de Investment Finder: " + id);
          }
          if (!html.includes("registros documentados")) throw new Error("Falta la etiqueta traducible del contador.");
          const start = html.indexOf("function filterInvestmentOpportunities(records,filters){");
          const end = html.indexOf("\nfunction investmentStageLabel", start);
          if (start < 0 || end < 0) throw new Error("No se encontró el filtro reutilizable de Investment Finder.");
          const normalizeText = value => String(value ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase("es").trim();
          const filter = vm.runInNewContext("(" + html.slice(start, end) + ")", { normalizeText });
          const record = catalog.opportunities[0];
          if (!record || record.opportunityStatus !== "unknown") throw new Error("El registro documental RIMI debe conservar disponibilidad desconocida.");
          const base = { query: "eficiencia energética", sector: "all", scope: "national", jurisdiction: "Nacional", status: "unknown", verification: "all" };
          const kit40Record = catalog.opportunities.find(item => item.id === "programa-kit-4-0-2026");
          if (!kit40Record || kit40Record.opportunityStatus !== "unknown" || kit40Record.verification?.status !== "verified") throw new Error("KIT 4.0 debe conservar fuente verificada y disponibilidad no confirmada.");
          if (filter(catalog.opportunities, { ...base, query: "kit 4.0" }).length !== 1) throw new Error("La búsqueda no encuentra KIT 4.0.");
          if (filter(catalog.opportunities, { ...base, query: "kit 4.0", status: "open" }).length !== 0) throw new Error("KIT 4.0 no debe aparecer como disponibilidad confirmada.");
          if (!kit40Record.description.includes("no como pago directo a la PyME")) throw new Error("La ficha debe aclarar que el beneficio se acredita al proveedor.");
          if (filter(catalog.opportunities, base).length !== 1) throw new Error("No se encontró el registro nacional mediante búsqueda y filtros combinados.");
          if (filter(catalog.opportunities, { ...base, verification: "verified" }).length !== 1) throw new Error("El filtro debe encontrar una fuente verificada aunque la disponibilidad sea desconocida.");
          if (filter(catalog.opportunities, { ...base, verification: "outdated" }).length !== 0) throw new Error("Una fuente verificada no debe aparecer como desactualizada.");
          const exportStart = html.indexOf("function exportVisibleInvestmentOpportunities(){");
          const exportEnd = html.indexOf("\nasync function loadInvestmentFinder", exportStart);
          if (exportStart < 0 || exportEnd < 0) throw new Error("No se encontró la exportación filtrada de Investment Finder.");
          const exportFunction = html.slice(exportStart, exportEnd);
          if (!exportFunction.includes('verification:document.getElementById("investment-verification").value')) throw new Error("El CSV debe respetar el filtro de verificación visible.");
          const verificationFixtures = [
            { ...record, id: "fixture-fuente-verificada", verification: { ...record.verification, status: "verified" } },
            { ...record, id: "fixture-fuente-desactualizada", verification: { ...record.verification, status: "outdated" } }
          ];
          if (filter(verificationFixtures, { ...base, verification: "verified" }).length !== 1) throw new Error("El filtro no separa las fuentes verificadas.");
          if (filter(verificationFixtures, { ...base, verification: "outdated" }).length !== 1) throw new Error("El filtro no separa las verificaciones desactualizadas.");
          if (filter(catalog.opportunities, { ...base, status: "open" }).length !== 0) throw new Error("El registro RIMI no debe aparecer como oportunidad abierta.");
          if (filter(catalog.opportunities, { ...base, stage: "unknown" }).length !== 1) throw new Error("El filtro por etapa no encuentra el registro RIMI.");
          if (filter(catalog.opportunities, { ...base, stage: "announced" }).length !== 0) throw new Error("El filtro por etapa mezcló registros de distintas etapas.");
          const stagedFixtures = [record, { ...record, id: "fixture-anunciado", stage: "announced" }];
          if (filter(stagedFixtures, { ...base, stage: "announced" }).length !== 1) throw new Error("El filtro por etapa no aísla registros anunciados.");
          if (filter(stagedFixtures, { ...base, stage: "unknown" }).length !== 1) throw new Error("El filtro por etapa no conserva registros sin etapa informada.");
          const stageStart = html.indexOf("function investmentStageLabel(stage){");
          const stageEnd = html.indexOf("\nfunction investmentStatusLabel", stageStart);
          if (stageStart < 0 || stageEnd < 0) throw new Error("Falta el catálogo de etiquetas legibles para las etapas.");
          const stageLabel = vm.runInNewContext("(" + html.slice(stageStart, stageEnd) + ")");
          if (stageLabel("announced") !== "Anunciado" || stageLabel("unknown") !== "Etapa no informada") throw new Error("Las etiquetas de etapa no son correctas.");
          if (filter(catalog.opportunities, { ...base, scope: "provincial" }).length !== 0) throw new Error("El filtro provincial incluyó un registro nacional.");
          if (filter(catalog.opportunities, { ...base, jurisdiction: "Buenos Aires" }).length !== 0) throw new Error("El filtro de jurisdicción incluyó un registro nacional.");
          if (filter(catalog.opportunities, { ...base, query: "boletin oficial" }).length !== 1) throw new Error("La búsqueda no encuentra la fuente documental.");
          for (const field of ["sourceName", "sourceUrl", "sourcePublishedAt", "period", "validFrom", "verification"]) {
            if (!record[field]) throw new Error("El registro carece de trazabilidad: " + field);
          }
          if (!record.sourceUrl.startsWith("https://") || !record.verification.checkedAt || !record.verification.scope) {
            throw new Error("La fuente y el alcance/fecha de verificación deben permanecer visibles.");
          }
          console.log("Investment Finder: filtros locales, alcance nacional, estado desconocido y trazabilidad comprobados.");
          JS

