          assert.equal(filter([escobarRecord], { ...base, section: "Primera" }).length, 1);
          assert.equal(filter([escobarRecord], { ...base, section: "Sexta" }).length, 0);
          assert.equal(filter([escobarRecord], { ...base, municipality: "La Plata" }).length, 0);
          assert.equal(filter(catalog.opportunities, { ...base, query: "escobar" }).some(o => o.id === escobarRecord.id), true);
          const inline = [...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)].filter(m => !/application\/ld\+json/.test(m[1]) && !/src=/.test(m[1])).map(m => m[2]);
          for (const code of inline) new Function(code);
          console.log("PBA Finder: 135 municipios, ocho secciones, catálogo bonaerense y filtros territoriales validados.");
          JS

