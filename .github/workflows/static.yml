      - name: Validate Mapa Federal Argentina logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          logo = Path("assets/mapa-federal.svg")
          root = ET.parse(logo).getroot()
          ns = {"svg": "http://www.w3.org/2000/svg"}
          assert root.attrib.get("viewBox") == "0 0 1055 1491"
          assert root.attrib.get("aria-label") == "Mapa Federal"
          paths = root.findall(".//svg:path", ns)
          assert len(paths) == 5, "El mapa de Argentina debe conservar sus cinco trazados"
          fills = {path.attrib.get("fill") for path in paths}
          assert {"#07502B", "#A65A18"}.issubset(fills), "Falta la paleta verde y ocre del mapa"
          assert root.find(".//svg:rect", ns) is not None, "Falta el fondo del SVG"
          html = Path("index.html").read_text(encoding="utf-8")
          nodes_html = Path("nodos-estrategicos/index.html").read_text(encoding="utf-8")
          assert html.count("./assets/mapa-federal.svg") >= 2, "El logo debe aparecer en navegación y portada"
          for page in (html, nodes_html):
              assert "Silueta de Argentina en verde y ocre" in page
              assert "aspect-ratio:auto" in page, "El logo vertical no debe forzarse a formato cuadrado"
          print("Logo SVG válido: silueta argentina, trazados, paleta y proporción accesible comprobados.")
          PY
      - name: Validate Escobar local profile and provenance
        run: |
          node --check assets/escobar-profile.js
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          territory = json.loads(Path("data/escobar-territory.json").read_text(encoding="utf-8"))
          economy = json.loads(Path("data/escobar-economic-profile.json").read_text(encoding="utf-8"))
          nodes = json.loads(Path("data/strategic-nodes.json").read_text(encoding="utf-8"))
          html = Path("index.html").read_text(encoding="utf-8")
          assert len(territory["localities"]) == 7
          assert sum(item["officiallyRecognizedNeighborhoods"] for item in territory["localities"]) == 246
          assert territory["sourcePublishedAt"] == "2026-09-25"
          assert territory["status"] == "operativo" and territory["validityPeriod"]
          assert territory["verification"]["checkedAt"] == "2026-11-23"
          assert len(territory["serviceDirectories"]) == 4
          health = territory["healthFacilitiesDirectory"]
          assert health["status"] == "operativo"
          assert health["sourceUrl"] == "https://www.escobar.gob.ar/municipio/guardias/"
          assert health["sourcePublishedAt"] is None
          assert health["verification"]["checkedAt"] == "2026-11-23"
          assert "no se realizó comprobación presencial" in health["verification"]["scope"]
          assert len(health["facilities"]) == 11
          assert {item["locality"] for item in health["facilities"]} == {"Belén de Escobar", "Garín", "Ingeniero Maschwitz", "Maquinista Savio", "Matheu", "Loma Verde"}
          selles = next(item for item in health["facilities"] if item["id"] == "caps-juan-carlos-selles")
          assert selles["locality"] == "Garín" and selles["neighborhood"] == "24 de Febrero"
          lopez = next(item for item in health["facilities"] if item["id"] == "hospital-horacio-lopez")
          assert lopez["address"] is None and "156" in lopez["addressNote"] and "240" in lopez["addressNote"]
          susana = next(item for item in health["facilities"] if item["id"] == "udp-susana-lara")
          assert "16:30" in susana["serviceNote"] and "17 h" in susana["serviceHours"]
          for url in [health["sourceUrl"], health["additionalDirectoryUrl"]] + [item.get("addressSourceUrl") for item in health["facilities"] if item.get("addressSourceUrl")] + [item.get("serviceNoteSourceUrl") for item in health["facilities"] if item.get("serviceNoteSourceUrl")]:
              parsed = urlparse(url)
              assert parsed.scheme == "https" and parsed.netloc
          allowed = {"operativo", "anunciado", "histórico", "pendiente", "no verificado"}
          for item in territory["serviceDirectories"]:
              parsed = urlparse(item["sourceUrl"])
              assert parsed.scheme == "https" and parsed.netloc
              assert item["status"] in allowed
              assert item["verification"]["checkedAt"] == "2026-11-23"
              assert item["verification"]["scope"]
          caps = next((item for item in territory["serviceDirectories"] if item.get("id") == "caps-juan-carlos-selles"), None)
          assert caps is not None
          assert caps["locality"] == "Garín" and caps["neighborhood"] == "24 de Febrero"
          assert caps["address"] == "Pablo Marín, B° 24 de Febrero, Garín"
          assert caps["serviceHours"] == "Todos los días, las 24 horas"
          assert caps["phone"] == "11 2150-0302"
          assert caps["status"] == "operativo"
          assert caps["verification"]["checkedAt"] == "2026-11-23"
          assert "no aporta coordenadas oficiales" in caps["verification"]["scope"]
          parsed_map = urlparse(caps["mapUrl"])
          assert parsed_map.scheme == "https" and parsed_map.netloc == "www.google.com"
          profile_js = Path("assets/escobar-profile.js").read_text(encoding="utf-8")
          assert 'sourceLink(item.mapUrl,"Cómo llegar ↗")' in profile_js
